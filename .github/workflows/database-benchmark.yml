name: Database Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: ClickHouse vs TimescaleDB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Validate benchmark configuration
        run: make benchmark-test

      - name: Validate Compose configuration
        run: docker compose -f benchmark/docker-compose.yml config

      - name: Run benchmark
        run: make benchmark-run

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-benchmark-results
          path: benchmark/results/
          if-no-files-found: warn

      - name: Stop benchmark services
        if: always()
        run: docker compose -f benchmark/docker-compose.yml down -v
