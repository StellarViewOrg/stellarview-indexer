services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: stellar_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "55432:5432"
    volumes:
      - benchmark_postgres_data:/var/lib/postgresql/data
      - ../infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d stellar_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    ports:
      - "58123:8123"
      - "59000:9000"
    volumes:
      - benchmark_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  benchmark_postgres_data:
  benchmark_clickhouse_data:
